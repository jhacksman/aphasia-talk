name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests (mock-inference mode)
        run: python -m pytest -q

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - name: Analyze
        run: |
          flutter pub get
          flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Build Android APK (release, debug-signed)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aphasia-talk-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  mobile-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - name: Build iOS for simulator (verifies the iOS target compiles; no signing required)
        # A *device* build requires an Apple Development Team even with
        # --no-codesign on current Xcode; the simulator build is the standard
        # unsigned CI compile check. Real device/TestFlight builds happen on a
        # signing-capable Mac (see mobile/README.md).
        run: |
          flutter pub get
          flutter build ios --simulator --debug
