name: aphasia_talk
description: >-
  Communication aid for a person with Alzheimer's and aphasia. Tap a word,
  get AI-generated sentences from a local DGX Spark, tap one to speak it.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  http_parser: ^4.0.2
  flutter_tts: ^4.2.0
  shared_preferences: ^2.3.3
  record: ^7.1.1
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  file_picker: ^10.1.2
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
